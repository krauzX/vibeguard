name: VibeGuard PR Comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Update PR Comment
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      
      - name: Build VibeGuard
        run: go build -o vibeguard .
      
      - name: Run Scan
        continue-on-error: true
        run: ./vibeguard scan . --json --output results.json --quiet
      
      - name: Find Existing Comment
        uses: actions/github-script@v7
        id: find-comment
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const marker = '<!-- vibeguard-comment -->';
            const existing = comments.data.find(c => c.body.includes(marker));
            
            if (existing) {
              core.setOutput('comment-id', existing.id);
            } else {
              core.setOutput('comment-id', '');
            }
      
      - name: Create or Update Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('results.json', 'utf8'));
            
            const marker = '<!-- vibeguard-comment -->';
            const critical = results.summary.critical;
            const warnings = results.summary.warning;
            const total = results.summary.total_issues;
            
            let status = 'PASSED';
            if (critical > 0) status = 'FAILED';
            else if (warnings > 0) status = 'WARNING';
            
            let body = `${marker}\n`;
            body += `## VibeGuard Security Scan: ${status}\n\n`;
            body += `| Metric | Value |\n|--------|-------|\n`;
            body += `| Critical | ${critical} |\n`;
            body += `| Warning | ${warnings} |\n`;
            body += `| Total | ${total} |\n`;
            body += `| Scan Time | ${results.summary.duration} |\n`;
            
            if (critical > 0) {
              body += `\n<details>\n<summary>Critical Issues</summary>\n\n`;
              results.findings
                .filter(f => f.severity === 'CRITICAL')
                .forEach(f => {
                  body += `- \`${f.rule_id}\`: ${f.message}\n  File: \`${f.file}:${f.line}\`\n`;
                });
              body += `\n</details>\n`;
            }
            
            const commentId = '${{ steps.find-comment.outputs.comment-id }}';
            
            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
