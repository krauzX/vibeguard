name: VibeGuard Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      
      - name: Build VibeGuard
        run: go build -o vibeguard .
      
      - name: Run VibeGuard Scan (SARIF)
        continue-on-error: true
        run: ./vibeguard scan . --sarif --output vibeguard-results.sarif --no-color --quiet

      - name: Run VibeGuard Scan (JSON)
        continue-on-error: true
        run: ./vibeguard scan . --json --output vibeguard-results.json --quiet
        
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: vibeguard-results.sarif
          category: vibeguard
      
      - name: Upload Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibeguard-results
          path: |
            vibeguard-results.sarif
            vibeguard-results.json
      
      - name: Fail on Critical
        if: always()
        run: |
          CRITICAL=$(jq '.summary.critical' vibeguard-results.json)
          if [ "$CRITICAL" -gt 0 ]; then
            echo "found $CRITICAL critical findings"
            exit 1
          fi
